<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-4);background:var(--surface);font-family:var(--font-ui)}
.list{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.r{display:grid;grid-template-columns:20px 1fr 120px 120px 80px;align-items:center;gap:var(--space-3);height:var(--row-default);padding:0 var(--space-3);font:400 13px/18px var(--font-ui);color:var(--ink);border-bottom:1px solid var(--border)}
.r:last-child{border-bottom:0}
.r:hover{background:var(--surface-sunken)}
.r.sel{background:var(--brand-subtle)}
.m{font:400 12px/16px var(--font-mono);color:var(--ink-muted)}
.m.end{text-align:right}
.o{color:var(--ink-muted);font-size:12px}
svg{width:16px;height:16px;fill:none;stroke:var(--ink-muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fo svg{stroke:var(--brand)}
.sel svg{stroke:var(--ink)}.sel.fo svg{stroke:var(--brand)}
.bar{display:inline-block;width:64px;height:6px;border-radius:0 var(--radius-full) var(--radius-full) 0;background:var(--border);vertical-align:middle;margin-right:var(--space-2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--patina)}
.err{color:var(--danger);font-weight:600}
</style></head><body>
<div class="list">

<div class="r sel"><svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v8.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5zM9 2v3h3"/></svg><span>Quarterly plan.pdf</span><span class="o">Priya N.</span><span class="m">Nov 22, 16:40</span><span class="m end">4.2 MB</span></div>
<div class="r"><svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v8.5a.5.5 0 0 1-.5.5h-7.5a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5zM9 2v3h3"/></svg><span>site-photos.zip</span><span class="o"><span class="bar"><i></i></span>62%</span><span class="m">Uploading</span><span class="m end">318 MB</span></div>
