# Builds a Linux AppImage and a Windows zip.
# - Every push to main / PR: the files are attached to the workflow run as artifacts.
# - Tags `v*`: the files are also published to a GitHub release for that tag.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux-appimage:
    runs-on: ubuntu-latest
    container:
      # Debian bookworm (glibc 2.36): the AppImage runs on any distro at least this new.
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config file curl ca-certificates git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: packaging/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows-zip:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip curl ca-certificates git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build Windows zip
        run: packaging/build-windows.sh

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" --title "Dray $GITHUB_REF_NAME" --generate-notes
