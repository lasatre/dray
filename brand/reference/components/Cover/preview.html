<!-- @dsCard height=288 -->
<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.c{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface)}
svg{position:absolute;left:0;top:0}
.b{fill:var(--brand)}.i{fill:var(--ink)}.p{fill:var(--patina)}
.t{position:absolute;left:48px;bottom:40px;width:440px}
h1{margin:0;font:700 120px/.92 var(--font-sans);letter-spacing:-.04em;color:var(--ink)}
p{margin:var(--space-2) 0 0;font:400 14px/18px var(--font-sans);color:var(--ink-muted)}
</style></head><body>
<div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: brand 300x80, ink 220x80, patina 360x80 (space-4 margin, space-2 gap), ~32% of the cover
     arrangement: three left-aligned bars stacked right of x=480, unequal lengths like transfer progress
     pattern: literal motif. The D of the mark (square left, round right) as bars with a dot trail of 4px dots at 16px pitch, like speed lines; chosen because Dray's one shape is the D and its one promise is speed
     steps/radii: space-1 dots, space-2 gap, space-4 pitch and margin, bar rx 40 = half the 80 height (radius-full) -->
<rect class="b" x="480" y="16" width="300" height="80" rx="40"/>
<rect class="i" x="480" y="104" width="220" height="80" rx="40"/>
<rect class="p" x="480" y="192" width="360" height="80" rx="40"/>
<g class="b"><circle cx="800" cy="56" r="4"/><circle cx="816" cy="56" r="4"/><circle cx="832" cy="56" r="4"/><circle cx="848" cy="56" r="4"/><circle cx="864" cy="56" r="4"/><circle cx="880" cy="56" r="4"/><circle cx="896" cy="56" r="4"/><circle cx="912" cy="56" r="4"/><circle cx="928" cy="56" r="4"/><circle cx="944" cy="56" r="4"/></g>
<g class="i"><circle cx="720" cy="144" r="4"/><circle cx="736" cy="144" r="4"/><circle cx="752" cy="144" r="4"/><circle cx="768" cy="144" r="4"/><circle cx="784" cy="144" r="4"/><circle cx="800" cy="144" r="4"/><circle cx="816" cy="144" r="4"/><circle cx="832" cy="144" r="4"/><circle cx="848" cy="144" r="4"/><circle cx="864" cy="144" r="4"/><circle cx="880" cy="144" r="4"/><circle cx="896" cy="144" r="4"/><circle cx="912" cy="144" r="4"/><circle cx="928" cy="144" r="4"/><circle cx="944" cy="144" r="4"/></g>
<g class="p"><circle cx="864" cy="232" r="4"/><circle cx="880" cy="232" r="4"/><circle cx="896" cy="232" r="4"/><circle cx="912" cy="232" r="4"/><circle cx="928" cy="232" r="4"/><circle cx="944" cy="232" r="4"/></g>
</svg>
<div class="t"><h1>Dray</h1><p>Your Drive, at native speed.</p></div>
</div>
</body></html>
