[package]
name = "gdriveoperator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
getrandom = "0.4.3"
open = "5.4.5"
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "gzip", "rustls", "http2", "query", "form"] }
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

# winit 0.30.13 + a small patch: emit CursorMoved for XDND position messages so drops can
# target a specific folder (see vendor/winit/PATCHED.md).
[patch.crates-io]
winit = { path = "vendor/winit" }

[build-dependencies]
embed-resource = "3.0.12"
