<!-- @dsCard group="Actions" height=120 subtitle="Primary, secondary, ghost, danger" -->
<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tokens.css">
<style>
body{margin:0;padding:var(--space-4);background:var(--surface);display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui)}
.row{display:flex;gap:var(--space-2);align-items:center}
button{font:600 13px/18px var(--font-ui);height:28px;padding:0 var(--space-3);border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer}
.p{background:var(--brand);color:var(--on-brand)}
.p:hover{background:var(--brand-strong)}
.s{background:var(--surface-raised);color:var(--ink);border-color:var(--border-strong)}
.g{background:transparent;color:var(--ink)}.g:hover{background:var(--surface-sunken)}
.d{background:var(--surface-raised);color:var(--danger);border-color:var(--danger)}
.f{outline:2px solid var(--focus-ring);outline-offset:2px}
button:disabled{background:var(--surface-sunken);color:var(--ink-muted);border-color:var(--border);cursor:default}
</style></head><body>
<div class="row"><button class="p">Upload</button><button class="s">New folder</button><button class="g">Cancel</button><button class="d">Delete 12 files</button></div>
<div class="row"><button class="p f">Focused</button><button class="s">Share</button><button class="s" disabled>Disabled</button></div>
</body></html>
